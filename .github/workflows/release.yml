name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: cp app/build/outputs/apk/release/app-release.apk YTXTube.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTXTube
          path: YTXTube.apk

      - name: Read version
        id: version
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$VER" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: YTXTube Custom ${{ steps.version.outputs.name }}
          files: YTXTube.apk
          body: |
            Custom build on top of YTXTube.

            - Home feed shows videos side by side (2 columns on the cover screen, more on the open screen).
            - Subtitle button on the player, captions switch on without delay.
            - Word by word captions: only the words already spoken are shown.
            - Installs next to the original YTXTube (different app id).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
